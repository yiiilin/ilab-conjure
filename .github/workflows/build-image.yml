name: Build Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: false
        default: main
      tag:
        description: "Extra image tag to apply (default: main)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and push WebUI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build WebUI assets (app.js / history.js / styles.css)
        run: |
          npm run build:webui:css
          npm run build:webui

      - name: Bump cache-busting versions to commit SHA
        shell: bash
        run: |
          V="$(git rev-parse --short HEAD)"
          cd codex_image/webui/static
          # html references
          sed -i "s|styles.css?v=runtime-[0-9a-f]*|styles.css?v=runtime-${V}|g" index.html history.html
          sed -i "s|app.js?v=runtime-[0-9a-f]*|app.js?v=runtime-${V}|g" index.html
          sed -i "s|history.js?v=history-[0-9a-f]*|history.js?v=history-${V}|g" history.html
          # service worker shell
          sed -i "s|CACHE_NAME = \"ilab-conjure-shell-v[0-9a-f]*\"|CACHE_NAME = \"ilab-conjure-shell-${V}\"|g" service-worker.js
          sed -i "s|/static/styles.css?v=runtime-[0-9a-f]*|/static/styles.css?v=runtime-${V}|g" service-worker.js
          sed -i "s|/static/app.js?v=runtime-[0-9a-f]*|/static/app.js?v=runtime-${V}|g" service-worker.js
          sed -i "s|/static/history.js?v=history-[0-9a-f]*|/static/history.js?v=history-${V}|g" service-worker.js
          echo "cache-bust version: ${V}"
          grep -o "v=runtime-[0-9a-f]*" index.html | head -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          REF="${{ github.event.inputs.ref || github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          else
            TAG="main"
          fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAGS="ghcr.io/yiiilin/ilab-conjure:${TAG}"
          EXTRA="${{ github.event.inputs.tag }}"
          if [[ -n "$EXTRA" ]]; then
            TAGS="${TAGS},ghcr.io/yiiilin/ilab-conjure:${EXTRA}"
          fi
          TAGS="${TAGS},ghcr.io/yiiilin/ilab-conjure:sha-${SHORT_SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
