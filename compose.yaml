name: ilab-conjure

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilab-conjure
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${ILAB_HOST_PORT:-13221}:8787"
    environment:
      TZ: Asia/Hong_Kong
      HOME: /home/app
      ILAB_ALLOWED_HOSTS: "${ILAB_ALLOWED_HOSTS:-img.yiln.de}"
    volumes:
      - ./data:/app/output
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/', timeout=5).read(128)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
